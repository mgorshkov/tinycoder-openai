openapi: 3.1.0
info:
  title: TinyCoder OpenAI Provider
  version: 1.0.0
  description: |
    OpenAI-compatible inference gateway for the tinycoder-inference engine.

    Users point their OpenAI-compatible client at the server URL
    (e.g. `https://api.tinycoder.dev/v1`), select a model from
    `GET /v1/models`, and issue chat or text completions. Models are loaded
    lazily on first use and evicted when idle.
  license:
    name: MIT
servers:
  - url: https://api.tinycoder.dev/v1
    description: Production
  - url: /v1
    description: Relative to the current host
tags:
  - name: Models
    description: Discover available models
  - name: Completions
    description: Text and chat generation
paths:
  /models:
    get:
      tags: [Models]
      summary: List available models
      operationId: listModels
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /chat/completions:
    post:
      tags: [Completions]
      summary: Create a chat completion
      operationId: createChatCompletion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: A chat completion (JSON, or an SSE stream when `stream` is true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events; each `data:` line is a ChatChunk, terminated by `data: [DONE]`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /generate:
    post:
      tags: [Completions]
      summary: Native generation endpoint (prompt or chat messages)
      operationId: generate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generated text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /completions:
    post:
      tags: [Completions]
      summary: Create a text completion (OpenAI-compatible)
      operationId: createCompletion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: A text completion (JSON or SSE stream)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Optional. Required only when the server is configured with an API key. Present the key as `Authorization: Bearer <key>`.
    apiKeyHeader:
      type: apiKey
      in: header
      name: api-key
      description: Alternative to bearerAuth. Present the key as `api-key: <key>` (Azure OpenAI / OpenAPI-style clients).
    xApiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Alternative to bearerAuth. Present the key as `x-api-key: <key>` (Anthropic-style compatible clients / AI SDK).
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Model not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ModelsResponse:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    Model:
      type: object
      required: [id, object, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        created:
          type: integer
          format: int64
        owned_by:
          type: string
        name:
          type: string
        architecture:
          type: string
        quantization:
          type: string
        context_length:
          type: integer
        size_bytes:
          type: integer
          format: int64
        loaded:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        description:
          type: string
    ChatMessage:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        tool_calls:
          type: array
          description: Present on assistant messages that requested tool calls.
          items:
            $ref: "#/components/schemas/ToolCall"
        tool_call_id:
          type: string
          description: Set on `tool` messages; the id of the call being answered.
        name:
          type: string
        content:
          description: >-
            Message content. Both a plain string and an array of typed content
            parts (as sent by OpenAI-compatible clients) are accepted; text
            parts are concatenated.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ContentPart"
    ContentPart:
      type: object
      properties:
        type:
          type: string
        text:
          type: string
    ChatRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        tools:
          type: array
          description: >-
            Functions the model may call. When present (and `tool_choice` is not
            `none`), the model is instructed to emit calls and the server returns
            them as `tool_calls`.
          items:
            $ref: "#/components/schemas/ToolDefinition"
        tool_choice:
          description: '"auto" (default), "none", "required", or an object selecting a function.'
          oneOf:
            - type: string
              enum: [auto, none, required]
            - type: object
              properties:
                type:
                  type: string
                  const: function
                function:
                  type: object
                  properties:
                    name:
                      type: string
        parallel_tool_calls:
          type: boolean
          default: true
        stream:
          type: boolean
          default: false
        stream_options:
          $ref: "#/components/schemas/StreamOptions"
        max_tokens:
          type: integer
        temperature:
          type: number
          format: float
        top_p:
          type: number
          format: float
        top_k:
          type: number
          format: float
        repeat_penalty:
          type: number
          format: float
        repeat_last_n:
          type: integer
        seed:
          type: integer
    CompletionRequest:
      type: object
      properties:
        model:
          type: string
        prompt:
          type: string
        input:
          type: string
        stream:
          type: boolean
          default: false
        stream_options:
          $ref: "#/components/schemas/StreamOptions"
        max_tokens:
          type: integer
        temperature:
          type: number
          format: float
        top_p:
          type: number
          format: float
        top_k:
          type: number
          format: float
        repeat_penalty:
          type: number
          format: float
        repeat_last_n:
          type: integer
        seed:
          type: integer
    ToolDefinition:
      type: object
      required: [type, function]
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          required: [name]
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object
              description: JSON Schema for the function arguments.
    ToolCall:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: function
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
              description: JSON-encoded arguments object.
    StreamOptions:
      type: object
      description: >-
        Options for streaming responses. Only `include_usage` is honored: when
        true, a final usage-only chunk is emitted before `data: [DONE]`.
      properties:
        include_usage:
          type: boolean
          default: false
    GenerateRequest:
      allOf:
        - $ref: "#/components/schemas/CompletionRequest"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    CompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
          format: int64
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              text:
                type: string
              finish_reason:
                type: string
        usage:
          $ref: "#/components/schemas/Usage"
    ChatResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
          format: int64
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: "#/components/schemas/ChatMessage"
              finish_reason:
                type: string
        usage:
          $ref: "#/components/schemas/Usage"
    ChatChunk:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
          format: int64
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              delta:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
                  tool_calls:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        id:
                          type: string
                        type:
                          type: string
                        function:
                          type: object
                          properties:
                            name:
                              type: string
                            arguments:
                              type: string
              finish_reason:
                type: string
                description: '"stop" normally, or "tool_calls" when tool calls were produced.'
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
