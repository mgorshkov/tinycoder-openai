# nginx reverse proxy for tinycoder-openai
#
# Key points:
#   * SSE streaming requires proxy_buffering off and a long read timeout.
#   * Large models can take a while to load on the first request, so the read
#     timeout is generous; the server itself bounds generation by
#     request_timeout_sec.
# Place under /etc/nginx/conf.d/ and adjust server_name / certificates.

# Capture the OpenAI-style JSON request body. nginx only exposes $request_body
# for logging when the body fits in the in-memory client body buffer, so
# client_body_buffer_size is raised in the /v1/ location below.
map $request_body $openai_request_body {
    ""      "{}";
    default $request_body;
}

# One JSON object per line, ready to be shipped to a log collector.
log_format openai_json escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"request_length":$request_length,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"content_type":"$content_type",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"openai_request":$openai_request_body'
    '}';

upstream tinycoder_openai {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name api.tinycoder.dev;

    # Route this vhost's diagnostics next to the access log.
    error_log /www/tinycoder.dev/logs/openai_error.log warn;

    ssl_certificate     /etc/letsencrypt/live/api.tinycoder.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tinycoder.dev/privkey.pem;

    # Canonical public API surface: https://api.tinycoder.dev/v1/...
    location /v1/ {
        proxy_pass http://tinycoder_openai/v1/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Streaming: do not buffer SSE chunks.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Log the OpenAI request (model, messages, parameters, ...) plus the
        # usual access metadata. Keep client_body_buffer_size large enough that
        # realistic chat payloads stay in memory and remain visible to
        # $request_body (otherwise they spill to a temp file and log as "{}").
        access_log /www/tinycoder.dev/logs/openai_access.log openai_json;
        client_body_buffer_size 1m;
        client_max_body_size 32m;
    }

    location = /healthz {
        proxy_pass http://tinycoder_openai/healthz;
        access_log off;
    }
}
